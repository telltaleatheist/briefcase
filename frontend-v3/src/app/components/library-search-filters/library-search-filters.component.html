<div class="search-filters">
  <!-- Search Bar (Always Visible) -->
  <div class="search-bar">
    <div class="search-input-wrapper">
      @if (isSearching()) {
        <span class="search-spinner">⏳</span>
      } @else {
        <span class="search-icon">🔍</span>
      }
      <input
        type="text"
        [(ngModel)]="filters.searchQuery"
        (ngModelChange)="onSearchChange()"
        (focus)="onSearchFocus()"
        [placeholder]="filters.deepSearch ? 'Search filenames and transcripts' : 'Search filenames'"
        title="Search tips:
• Words: all must be in the filename; spaces and punctuation are ignored (pastor props finds pastorswithprops)
• A repeated word must be there that many times (strike and strike)
• Exact phrase: &quot;strike and strike&quot; must be there in that order, run together
• Exclude: -unwanted
• Either: word1 OR word2
• The closest matches come first, newest upload first; click a column header to sort by it
• Deep search also finds what is said in the transcripts"
        class="search-input"
      />
    </div>
    <label class="meaning-toggle" title="Also search what is said in the transcripts: the words (said within about 30 seconds, near spellings too) and moments that mean what you typed, even in other words. Filename matches still come first.">
      <input type="checkbox" [ngModel]="filters.deepSearch" (ngModelChange)="onDeepSearchChange($event)" />
      Deep search
    </label>
    <button
      class="accordion-toggle"
      (click)="toggleAccordion()"
      [attr.aria-expanded]="expanded()"
    >
      <span class="toggle-icon">{{ expanded() ? '▲' : '▼' }}</span>
      <span>Filters</span>
    </button>
  </div>

  <!-- Advanced Filters (Accordion Content) -->
  <div class="accordion-content" [class.expanded]="expanded()">
    <!-- Filter Row: Date, Type, Status -->
    <div class="filter-row">
      <div class="filter-group">
        <label>Date</label>
        <select
          [(ngModel)]="filters.dateRange"
          (ngModelChange)="onFilterChange()"
          class="filter-select"
        >
          <option value="all">All Time</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="year">This Year</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Type</label>
        <select
          [(ngModel)]="filters.mediaType"
          (ngModelChange)="onFilterChange()"
          class="filter-select"
        >
          <option value="all">All Types</option>
          <option value="video">Video</option>
          <option value="audio">Audio</option>
          <option value="image">Image</option>
          <option value="document">PDF</option>
          <option value="webpage">Webpage</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Duration</label>
        <select
          [(ngModel)]="filters.duration"
          (ngModelChange)="onFilterChange()"
          class="filter-select"
        >
          <option value="all">Any</option>
          <option value="under10">Under 10 min</option>
          <option value="over10">Over 10 min</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Transcript</label>
        <select
          [(ngModel)]="filters.hasTranscript"
          (ngModelChange)="onFilterChange()"
          class="filter-select"
        >
          <option [ngValue]="null">Any</option>
          <option [ngValue]="true">Has</option>
          <option [ngValue]="false">Missing</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Analysis</label>
        <select
          [(ngModel)]="filters.hasAnalysis"
          (ngModelChange)="onFilterChange()"
          class="filter-select"
        >
          <option [ngValue]="null">Any</option>
          <option [ngValue]="true">Has</option>
          <option [ngValue]="false">Missing</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Suggestions</label>
        <select
          [(ngModel)]="filters.hasSuggestions"
          (ngModelChange)="onFilterChange()"
          class="filter-select"
        >
          <option [ngValue]="null">Any</option>
          <option [ngValue]="true">Has</option>
          <option [ngValue]="false">None</option>
        </select>
      </div>

      <div class="filter-group">
        <label>&nbsp;</label>
        <button
          class="clear-filters-btn"
          (click)="clearFilters()"
        >
          Clear All
        </button>
      </div>
    </div>
  </div>
</div>
