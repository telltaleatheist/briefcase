<div class="sections-layer">
  @for (section of sections; track section.id) {
    <div
      class="section-block"
      [class.selected]="selectedSection?.id === section.id"
      [class.ghosted]="isGhostSection(section)"
      [style.left]="getSectionStyle(section).left"
      [style.width]="getSectionStyle(section).width"
      [style.backgroundColor]="getSectionStyle(section).backgroundColor"
      [style.borderColor]="getSectionStyle(section).borderColor"
      [style.display]="getSectionStyle(section).display"
      [title]="isGhostSection(section)
        ? section.category + ' [' + ghostCaption(section) + ']: ' + section.description
        : section.category + ': ' + section.description"
      (click)="onSectionClick(section, $event)"
      (mouseenter)="onSectionMouseEnter(section)"
      (mouseleave)="onSectionMouseLeave()">
      <!-- Drag an edge to stretch or shrink the section -->
      @if (!getSectionStyle(section).clippedLeft) {
        <div class="resize-handle left"
             title="Drag to move the start"
             (mousedown)="onResizeHandleMouseDown(section, 'left', $event)"></div>
      }
      @if (!getSectionStyle(section).clippedRight) {
        <div class="resize-handle right"
             title="Drag to move the end"
             (mousedown)="onResizeHandleMouseDown(section, 'right', $event)"></div>
      }
    </div>
  }
</div>
