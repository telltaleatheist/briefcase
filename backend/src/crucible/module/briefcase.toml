# What Briefcase needs from a Crucible. PHASE13-OPERATOR.md section 5.4.
#
# DRAFT FOR THE CRUCIBLE REPO. This file belongs at `modules/briefcase.toml` in
# github.com/telltaleatheist/crucible, beside bookforge.toml and foundry.toml.
# It lives here only until that PR lands (migration plan §3.4, §12 A6).
#
# How the vendored JSON beside it was made, and how it must be made from now on:
#
#   1. Land this file as `modules/briefcase.toml` in the crucible repo.
#   2. There: `python scripts/gen-modules.py` writes `modules/briefcase.module.json`;
#      `--check` and tests/test_modules.py then guard it in CI.
#   3. Here: after the next Crucible cut, `node tools/adopt-crucible-release.mjs <ver>`,
#      then copy `modules/briefcase.module.json` over `briefcase.module.json` in
#      this directory, byte for byte. Never edit the JSON by hand: its `version`
#      is a hash of its own content, and test/crucible/module-file.spec.ts checks it.
#
# The copy here was produced by the crucible repo's OWN generator at v1.0.32,
# run against this file in a scratch directory
# (`gen-modules.py --directory <scratch>`), so it is what step 2 will write.

[module]
name = "briefcase"

[[job_types]]
type = "llm"

[[job_types]]
type = "asr"

# Qwen3-ASR's word timestamps run its forced aligner in the `align` worker env
# (a missing env is refused `env_missing` at the submit).
[[job_types]]
type = "align"

# Chapters, flags, descriptions, tags and titles: one class. The SERVER resolves
# it per machine (PHASE15-HOST.md 5.3a), so no model id is typed here.
#
# A `decide` class (snap chapters and flags through /v1/decide) is added here
# once the decide door is released and PHASE22 §7.2 rules on its class name.
[[needs]]
class = "analysis"

# The transcriber: Qwen3-ASR-0.6B, the fastest on each machine (Briefcase,
# 2026-09-24: "we dont need exact text with ums and uhs here, we just need it
# fast"): `qwen3-asr-0.6b-mlx` on the Mac, `qwen3-asr-0.6b` elsewhere
# (asr-models.ts qwenAsrModelFor), and the forced aligner it runs for word
# timestamps. Briefcase always asks Qwen for words: a Qwen segment is one piece
# of up to 180 s, and the aligner's words are what cut it into cues
# (crucible-transcript.ts). The generator scopes each subject to the backends
# that declare it, so the Mac-only build is asked of the Mac alone; the plain
# id is declared on both, so the Mac lists it too.
[[subjects]]
kind = "model"
id = "qwen3-asr-0.6b"

[[subjects]]
kind = "model"
id = "qwen3-asr-0.6b-mlx"

[[subjects]]
kind = "model"
id = "qwen3-aligner"
